{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CampusNav AI | TOC H</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
:root {
    --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
    --glass-bg: rgba(255, 255, 255, 0.06);
    --glass-border: rgba(255, 255, 255, 0.1);
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --accent-color: #6366f1;
    --accent-hover: #4f46e5;
    --bot-msg-bg: rgba(99, 102, 241, 0.15);
    --user-msg-bg: rgba(255, 255, 255, 0.1);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
}

body {
    background: var(--bg-gradient);
    color: var(--text-main);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.dashboard-container {
    display: flex;
    width: 1250px;
    height: 90vh;
    background: rgba(255,255,255,0.03);
    backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border);
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 24px 48px rgba(0,0,0,0.4);
}

.map-panel {
    width: 42%;
    border-right: 1px solid var(--glass-border);
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    background: rgba(0,0,0,0.2);
    overflow-y: auto;
}

.panel-header h2 {
    font-size: 1.5rem;
    display: flex;
    align-items: center;
    gap: 10px;
}

.panel-header h2 i {
    color: var(--accent-color);
}

.panel-header p {
    color: var(--text-muted);
    font-size: 0.85rem;
    margin-top: 4px;
}

.map-placeholder {
    background: rgba(0,0,0,0.3);
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    padding: 12px;
}

#leafletMap {
    width: 100%;
    height: 340px;
    border-radius: 14px;
    background: #111827;
}

.leaflet-container {
    background: #111827;
}

.direction-box {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.direction-box h3,
.quick-routes h3 {
    font-size: 0.95rem;
    color: var(--text-muted);
    margin-bottom: 5px;
    display: flex;
    align-items: center;
    gap: 6px;
}

.direction-box select {
    background: rgba(0,0,0,0.3);
    border: 1px solid var(--glass-border);
    color: var(--text-main);
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 0.875rem;
}

.direction-box select option {
    background: #1e1b4b;
    color: white;
}

.direction-box button,
.speak-route-btn {
    background: var(--accent-color);
    color: white;
    border: none;
    padding: 10px;
    border-radius: 10px;
    cursor: pointer;
}

.direction-box button:hover,
.speak-route-btn:hover {
    background: var(--accent-hover);
}

.directions-result {
    background: rgba(0,0,0,0.2);
    border: 1px solid var(--glass-border);
    border-radius: 12px;
    padding: 14px;
    max-height: 220px;
    overflow-y: auto;
}

.directions-result h4 {
    font-size: 0.85rem;
    color: var(--accent-color);
    margin-bottom: 10px;
}

.route-meta {
    font-size: 0.85rem;
    color: var(--text-main);
    margin-bottom: 10px;
    line-height: 1.5;
}

.directions-result ol {
    padding-left: 18px;
}

.directions-result li {
    font-size: 0.82rem;
    margin-bottom: 8px;
}

.route-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

.tag {
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    color: var(--text-main);
    padding: 8px 14px;
    border-radius: 20px;
    font-size: 0.85rem;
    cursor: pointer;
}

.tag:hover {
    background: var(--accent-color);
    transform: translateY(-2px);
}

.chat-panel {
    width: 58%;
    display: flex;
    flex-direction: column;
}

.chat-header {
    padding: 20px 30px;
    border-bottom: 1px solid var(--glass-border);
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.bot-profile {
    display: flex;
    align-items: center;
    gap: 12px;
}

.avatar {
    width: 45px;
    height: 45px;
    background: var(--accent-color);
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
}

.online-indicator {
    position: absolute;
    bottom: 2px;
    right: 2px;
    width: 10px;
    height: 10px;
    background: #10b981;
    border: 2px solid #1e1b4b;
    border-radius: 50%;
}

.bot-info p {
    font-size: 0.75rem;
    color: var(--text-muted);
}

.clear-btn {
    background: transparent;
    border: none;
    color: var(--text-muted);
    font-size: 1.1rem;
    cursor: pointer;
}

.clear-btn:hover {
    color: #ef4444;
}

.chat-messages {
    flex: 1;
    padding: 30px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.message {
    max-width: 80%;
    display: flex;
    flex-direction: column;
    gap: 5px;
}

.message.bot {
    align-self: flex-start;
}

.message.user {
    align-self: flex-end;
}

.message-content {
    padding: 14px 18px;
    border-radius: 18px;
    font-size: 0.95rem;
    line-height: 1.5;
    white-space: normal;
}

.bot .message-content {
    background: var(--bot-msg-bg);
    border: 1px solid rgba(99,102,241,0.3);
    border-top-left-radius: 4px;
}

.user .message-content {
    background: var(--user-msg-bg);
    border: 1px solid rgba(255,255,255,0.1);
    border-top-right-radius: 4px;
}

.timestamp {
    font-size: 0.7rem;
    color: var(--text-muted);
}

.user .timestamp {
    align-self: flex-end;
}

.typing-indicator {
    display: flex;
    gap: 5px;
}

.typing-indicator span {
    width: 8px;
    height: 8px;
    background: var(--text-muted);
    border-radius: 50%;
    animation: bounce 1.4s infinite ease-in-out both;
}

.typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
.typing-indicator span:nth-child(2) { animation-delay: -0.16s; }

@keyframes bounce {
    0%, 80%, 100% { transform: scale(0); }
    40% { transform: scale(1); }
}

.chat-input-area {
    padding: 20px 30px;
    border-top: 1px solid var(--glass-border);
}

#chatForm {
    display: flex;
    gap: 12px;
}

#userInput {
    flex: 1;
    background: rgba(0,0,0,0.3);
    border: 1px solid var(--glass-border);
    padding: 14px 20px;
    border-radius: 14px;
    color: white;
    font-size: 0.95rem;
}

#userInput:focus {
    outline: none;
    border-color: var(--accent-color);
}

#sendBtn,
#voiceBtn {
    color: white;
    border: none;
    width: 50px;
    height: 50px;
    border-radius: 14px;
    cursor: pointer;
    font-size: 1.1rem;
}

#sendBtn {
    background: var(--accent-color);
}

#sendBtn:hover {
    background: var(--accent-hover);
}

#voiceBtn {
    background: #10b981;
}

#voiceBtn.listening {
    background: #ef4444;
    animation: pulse 1s infinite;
}

@keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.08); }
    100% { transform: scale(1); }
}

@media (max-width: 900px) {
    .dashboard-container {
        flex-direction: column;
        height: auto;
    }

    .map-panel,
    .chat-panel {
        width: 100%;
    }

    .chat-panel {
        min-height: 500px;
    }
}
</style>
</head>

<body>

<div class="dashboard-container">

    <aside class="map-panel">

        <div class="panel-header">
            <h2><i class="fa-solid fa-compass"></i> CampusNav AI</h2>
            <p>TOC H Einstein Block Navigation System</p>
        </div>

        <div class="map-placeholder">
            <div id="leafletMap"></div>
        </div>

        <div class="direction-box">
            <h3><i class="fa-solid fa-route"></i> Get Directions</h3>

            <select id="startLocation">
                <option value="">-- From --</option>
                <option>Main Entrance</option>
                <option>Ground Floor Entrance Lobby</option>
                <option>Central Library</option>
                <option>Digital Library</option>
                <option>Telepresence Lab</option>
                <option>R&D Centre</option>
                <option>Department Of Maths</option>
                <option>EEE Lab</option>
                <option>CSE 1st Year Section A</option>
                <option>CSE 1st Year Section B</option>
                <option>CSE 1st Year Section C</option>
                <option>Physics Lab</option>
                <option>Chemistry Lab</option>
                <option>Programming Lab 1</option>
                <option>Programming Lab 3</option>
                <option>CSE Project Lab</option>
                <option>EEE Project Room</option>
                <option>Electrical Lab</option>
                <option>EEE Computer Lab</option>
                <option>Basic Electrical Lab</option>
                <option>Advanced Electrical Lab</option>
                <option>Power Electronics Lab</option>
                <option>Environmental Research Lab</option>
                <option>Seminar Hall</option>
            </select>

            <select id="endLocation">
                <option value="">-- To --</option>
                <option>Main Entrance</option>
                <option>Ground Floor Entrance Lobby</option>
                <option>Central Library</option>
                <option>Digital Library</option>
                <option>Telepresence Lab</option>
                <option>R&D Centre</option>
                <option>Department Of Maths</option>
                <option>EEE Lab</option>
                <option>CSE 1st Year Section A</option>
                <option>CSE 1st Year Section B</option>
                <option>CSE 1st Year Section C</option>
                <option>Physics Lab</option>
                <option>Chemistry Lab</option>
                <option>Programming Lab 1</option>
                <option>Programming Lab 3</option>
                <option>CSE Project Lab</option>
                <option>EEE Project Room</option>
                <option>Electrical Lab</option>
                <option>EEE Computer Lab</option>
                <option>Basic Electrical Lab</option>
                <option>Advanced Electrical Lab</option>
                <option>Power Electronics Lab</option>
                <option>Environmental Research Lab</option>
                <option>Seminar Hall</option>
            </select>

            <button id="getDirectionsBtn">
                <i class="fa-solid fa-location-arrow"></i> Get Directions
            </button>
        </div>

        <div class="directions-result" id="directionsResult" style="display:none;">
            <h4 id="routeSummary"></h4>
            <div class="route-meta" id="routeMeta"></div>
            <ol id="stepsList"></ol>
            <button class="speak-route-btn" id="speakRouteBtn" style="display:none;">
                <i class="fa-solid fa-volume-high"></i> Speak Route
            </button>
        </div>

        <div class="quick-routes">
            <h3><i class="fa-solid fa-bolt"></i> Quick Destinations</h3>

            <div class="route-tags">
                <button class="tag" onclick="sendQuickQuery('Directions to Central Library')">Library</button>
                <button class="tag" onclick="sendQuickQuery('Directions to Telepresence Lab')">Telepresence</button>
                <button class="tag" onclick="sendQuickQuery('Directions to Physics Lab')">Physics</button>
                <button class="tag" onclick="sendQuickQuery('Directions to Chemistry Lab')">Chemistry</button>
            </div>
        </div>

    </aside>

    <main class="chat-panel">

        <div class="chat-header">
            <div class="bot-profile">
                <div class="avatar">
                    <i class="fa-solid fa-robot"></i>
                    <span class="online-indicator"></span>
                </div>

                <div class="bot-info">
                    <h3>NaviBot</h3>
                    <p>Einstein Block Assistant • Online</p>
                </div>
            </div>

                <div style="display:flex;gap:10px;">

                    <button class="clear-btn"
                            id="toggleVoice"
                            title="Voice ON/OFF">
                        <i class="fa-solid fa-volume-high"></i>
                    </button>

                    <button class="clear-btn"
                            id="clearChat"
                            title="Clear Conversation">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>

                </div>
            </div>

            <div class="chat-messages" id="chatMessages">
                <div class="message bot">
                    <div class="message-content">
                        👋 Welcome to CampusNav AI.
                        <br><br>
                        Select locations from the left panel or ask:
                        <br>
                    </div>
                    <span class="timestamp">Just now</span>
                </div>
            </div>

        <div class="chat-input-area">
            <form id="chatForm" autocomplete="off">

                <input
                    type="text"
                    id="userInput"
                    placeholder="Ask directions, e.g. from Main Entrance to Chemistry Lab"
                    required
                >

                <button type="button" id="voiceBtn" title="Voice Input">
                    <i class="fa-solid fa-microphone"></i>
                </button>

                <button type="submit" id="sendBtn">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>

            </form>
        </div>

    </main>

</div>

<script>
let lastSpokenRoute = "";
let voiceEnabled = true;
let leafletMap;
let routeLine;
let movingMarker;

const mapWidth = 1000;
const mapHeight = 700;

const locationCoords = {
    "Main Entrance": [500, 650],
    "Ground Floor Entrance Lobby": [500, 590],
    "Ground Floor Corridor": [500, 520],
    "Central Library": [380, 500],
    "Digital Library": [300, 500],
    "Telepresence Lab": [620, 500],
    "R&D Centre": [710, 500],
    "Department Of Maths": [500, 450],
    "EEE Lab": [720, 430],
    "CSE 1st Year Section A": [330, 430],
    "CSE 1st Year Section B": [430, 430],
    "CSE 1st Year Section C": [530, 430],
    "Ground Floor Staircase East": [650, 520],
    "Ground Floor Staircase West": [350, 520],

    "First Floor Entrance Lobby": [500, 370],
    "First Floor Corridor": [500, 320],
    "Programming Lab 1": [300, 300],
    "Programming Lab 3": [380, 300],
    "Physics Lab": [600, 300],
    "Chemistry Lab": [720, 300],
    "CSE Staff Room 3": [450, 280],
    "First Floor Staircase East": [650, 330],
    "First Floor Staircase West": [350, 330],
    "Lift First Floor": [500, 340],

    "Upper Ground Entrance Lobby": [500, 240],
    "Upper Ground Corridor": [500, 200],
    "CSE Project Lab": [300, 190],
    "EEE Project Room": [620, 190],
    "Electrical Lab": [710, 190],
    "EEE Computer Lab": [800, 190],
    "EEE Library": [620, 150],
    "Basic Electrical Lab": [680, 120],
    "Advanced Electrical Lab": [780, 120],
    "Power Electronics Lab": [880, 120],
    "Upper Ground Staircase East": [650, 210],
    "Upper Ground Staircase West": [350, 210],
    "Lift Upper Ground": [500, 220],

    "Lower Ground Corridor": [500, 80],
    "Environmental Research Lab": [320, 70],
    "Store": [400, 70],
    "EL 3rd Year Classroom": [500, 70],
    "EL 4th Year Classroom": [600, 70],
    "Advanced Power Electronics Lab": [720, 70],
    "Seminar Hall": [820, 70],
    "Lower Ground Staircase East": [650, 90],
    "Lower Ground Staircase West": [350, 90]
};

document.addEventListener('DOMContentLoaded', () => {
    initLeafletMap();

    const chatForm = document.getElementById('chatForm');
    const userInput = document.getElementById('userInput');
    const chatMessages = document.getElementById('chatMessages');
    const clearChatBtn = document.getElementById('clearChat');
    const voiceBtn = document.getElementById('voiceBtn');
    const speakRouteBtn = document.getElementById('speakRouteBtn');
    const toggleVoice =
    document.getElementById('toggleVoice');

    chatForm.addEventListener('submit', function(e) {
        e.preventDefault();

        const message = userInput.value.trim();
        if (!message) return;

        appendMessage(message, 'user');
        userInput.value = '';
        handleBotResponse(message);
    });

    clearChatBtn.addEventListener('click', function() {
        if (confirm("Clear chat history?")) {
            window.speechSynthesis.cancel();

            chatMessages.innerHTML = `
                <div class="message bot">
                    <div class="message-content">
                        Chat history cleared. How can I help you today?
                    </div>
                    <span class="timestamp">Just now</span>
                </div>
            `;

            clearRouteFromMap();
            document.getElementById('directionsResult').style.display = 'none';
        }
    });

    speakRouteBtn.addEventListener('click', function() {
        speakText(lastSpokenRoute);
    });
    toggleVoice.addEventListener('click', () => {

    voiceEnabled = !voiceEnabled;

    window.speechSynthesis.cancel();

    if (voiceEnabled) {
        toggleVoice.innerHTML =
            '<i class="fa-solid fa-volume-high"></i>';

        toggleVoice.title = "Voice ON";

        appendMessage("🔊 Voice turned ON", "bot");
    } else {
        toggleVoice.innerHTML =
            '<i class="fa-solid fa-volume-xmark"></i>';

        toggleVoice.title = "Voice OFF";

        appendMessage("🔇 Voice turned OFF", "bot");
    }

});

    setupVoiceInput(voiceBtn, userInput);
});

function initLeafletMap() {
    leafletMap = L.map('leafletMap', {
        crs: L.CRS.Simple,
        minZoom: -2,
        maxZoom: 2,
        zoomControl: true
    });

    const bounds = [[0, 0], [mapHeight, mapWidth]];

    L.imageOverlay("{% static 'map.jpeg' %}", bounds).addTo(leafletMap);
    leafletMap.fitBounds(bounds);

    for (const [name, point] of Object.entries(locationCoords)) {
        L.circleMarker([point[1], point[0]], {
            radius: 5,
            color: "#ffffff",
            weight: 2,
            fillColor: "#6366f1",
            fillOpacity: 1
        })
        .addTo(leafletMap)
        .bindPopup(name);
    }
}

function drawRouteOnLeaflet(path) {
    if (!leafletMap || !path || path.length === 0) return;

    clearRouteFromMap();

    const routePoints = [];

    path.forEach(place => {
        if (locationCoords[place]) {
            const point = locationCoords[place];
            routePoints.push([point[1], point[0]]);
        }
    });

    if (routePoints.length < 2) return;

    routeLine = L.polyline(routePoints, {
        color: "#22c55e",
        weight: 6,
        opacity: 0.95
    }).addTo(leafletMap);

    movingMarker = L.circleMarker(routePoints[0], {
        radius: 8,
        color: "#ffffff",
        weight: 2,
        fillColor: "#ef4444",
        fillOpacity: 1
    }).addTo(leafletMap);

    leafletMap.fitBounds(routeLine.getBounds(), {
        padding: [30, 30]
    });
}

function clearRouteFromMap() {
    if (routeLine) {
        leafletMap.removeLayer(routeLine);
        routeLine = null;
    }

    if (movingMarker) {
        leafletMap.removeLayer(movingMarker);
        movingMarker = null;
    }
}

function appendMessage(text, sender) {
    const chatMessages = document.getElementById('chatMessages');

    const time = new Date().toLocaleTimeString([], {
        hour: '2-digit',
        minute: '2-digit'
    });

    const messageDiv = document.createElement('div');
    messageDiv.classList.add('message', sender);

    messageDiv.innerHTML = `
        <div class="message-content">${text}</div>
        <span class="timestamp">${time}</span>
    `;

    chatMessages.appendChild(messageDiv);
    scrollToBottom();
}

async function handleBotResponse(userMessage) {
    const chatMessages = document.getElementById('chatMessages');

    const typingDiv = document.createElement('div');
    typingDiv.classList.add('message', 'bot');

    typingDiv.innerHTML = `
        <div class="message-content">
            <div class="typing-indicator">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    `;

    chatMessages.appendChild(typingDiv);
    scrollToBottom();

    try {
        const response = await fetch('/chat/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                message: userMessage
            })
        });

        const data = await response.json();

        typingDiv.remove();

        const reply = (data.reply || "No reply received.").replace(/\n/g, "<br>");

        appendMessage(reply, 'bot');

        if (data.path) {
            drawRouteOnLeaflet(data.path);
        }

        if (data.instructions) {
            updateDirectionBox(data);
        }

        speakText(data.reply || "No reply received.");

    } catch (error) {
        typingDiv.remove();
        appendMessage("Unable to connect to the server.", 'bot');
        speakText("Unable to connect to the server.");
        console.error(error);
    }
}

function sendQuickQuery(queryText) {
    appendMessage(queryText, 'user');
    handleBotResponse(queryText);
}

function scrollToBottom() {
    const chatMessages = document.getElementById('chatMessages');
    chatMessages.scrollTop = chatMessages.scrollHeight;
}

document.getElementById('getDirectionsBtn').addEventListener('click', async () => {
    const start = document.getElementById('startLocation').value;
    const end = document.getElementById('endLocation').value;

    if (!start || !end) {
        alert('Please select both From and To locations.');
        return;
    }

    if (start === end) {
        alert('Start and destination cannot be the same.');
        return;
    }

    try {
        const response = await fetch(
            `/directions/?start=${encodeURIComponent(start)}&end=${encodeURIComponent(end)}`
        );

        const data = await response.json();

        if (!data.path || data.path.length === 0) {
            updateDirectionBox(null);
            appendMessage(`Directions from ${start} to ${end}`, 'user');
            appendMessage(`No route found between ${start} and ${end}.`, 'bot');
            speakText(`No route found between ${start} and ${end}.`);
            clearRouteFromMap();
            return;
        }

        updateDirectionBox(data);
        drawRouteOnLeaflet(data.path);

        appendMessage(`Directions from ${start} to ${end}`, 'user');

        const routeReply =
            `🗺️ Route: ${data.path.join(' → ')}<br><br>` +
            `📏 Distance: ${data.distance} meters<br>` +
            `⏱️ Time: ${data.estimated_time} seconds<br><br>` +
            data.instructions.map(s => `📍 Step ${s.step}: ${s.instruction}`).join('<br><br>');

        appendMessage(routeReply, 'bot');

        lastSpokenRoute = routeReply;
        speakText(routeReply);

    } catch (error) {
        console.error(error);
        alert('Could not fetch directions.');
        speakText("Could not fetch directions.");
    }
});

function updateDirectionBox(data) {
    const resultBox = document.getElementById('directionsResult');
    const routeSummary = document.getElementById('routeSummary');
    const routeMeta = document.getElementById('routeMeta');
    const stepsList = document.getElementById('stepsList');
    const speakRouteBtn = document.getElementById('speakRouteBtn');

    if (!data || !data.path || data.path.length === 0) {
        routeSummary.textContent = 'No route found.';
        routeMeta.innerHTML = '';
        stepsList.innerHTML = '';
        resultBox.style.display = 'block';
        speakRouteBtn.style.display = 'none';
        return;
    }

    routeSummary.textContent = '🗺️ ' + data.path.join(' → ');

    routeMeta.innerHTML = `
        📏 Total Distance: ${data.distance} meters<br>
        ⏱️ Estimated Time: ${data.estimated_time} seconds
    `;

    stepsList.innerHTML = '';

    data.instructions.forEach(step => {
        const li = document.createElement('li');
        li.textContent = step.instruction;
        stepsList.appendChild(li);
    });

    resultBox.style.display = 'block';
    speakRouteBtn.style.display = 'block';

    lastSpokenRoute =
        `Route from ${data.path[0]} to ${data.path[data.path.length - 1]}. ` +
        `Total distance is ${data.distance} meters. ` +
        `Estimated time is ${data.estimated_time} seconds. ` +
        data.instructions.map(s => s.instruction).join(". ");
}

function setupVoiceInput(voiceBtn, userInput) {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
        voiceBtn.addEventListener('click', () => {
            alert("Voice input is not supported in this browser. Use Google Chrome.");
        });
        return;
    }

    const recognition = new SpeechRecognition();

    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.lang = 'en-IN';

    voiceBtn.addEventListener('click', () => {
        window.speechSynthesis.cancel();
        recognition.start();
        voiceBtn.classList.add('listening');
        userInput.placeholder = "Listening...";
    });

    recognition.onresult = function(event) {
        const transcript = event.results[0][0].transcript;
        userInput.value = transcript;

        appendMessage(transcript, 'user');
        userInput.value = '';
        handleBotResponse(transcript);
    };

    recognition.onend = function() {
        voiceBtn.classList.remove('listening');
        userInput.placeholder = "Ask directions, e.g. from Main Entrance to Chemistry Lab";
    };

    recognition.onerror = function(event) {
        voiceBtn.classList.remove('listening');
        userInput.placeholder = "Ask directions, e.g. from Main Entrance to Chemistry Lab";
        alert("Voice error: " + event.error);
    };
}

function speakText(text) {

    if (!voiceEnabled) {
        window.speechSynthesis.cancel();
        return;
    }

    if (!('speechSynthesis' in window)) {
        return;
    }

    window.speechSynthesis.cancel();

    const cleanText = String(text)
        .replace(/🗺️/g, "")
        .replace(/📍/g, "")
        .replace(/📏/g, "")
        .replace(/⏱️/g, "")
        .replace(/🟢/g, "")
        .replace(/🔴/g, "")
        .replace(/🔊/g, "")
        .replace(/🔇/g, "")
        .replace(/→/g, " to ")
        .replace(/<br><br>/g, ". ")
        .replace(/<br>/g, ". ")
        .replace(/<\/?[^>]+(>|$)/g, "")
        .replace(/\n/g, ". ");

    const speech = new SpeechSynthesisUtterance(cleanText);

    speech.lang = "en-IN";
    speech.rate = 0.9;
    speech.pitch = 1;

    window.speechSynthesis.speak(speech);
}
